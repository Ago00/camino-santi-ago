allowBuilds:
  # Los tres descargan binarios precompilados por plataforma en su postinstall.
  # Sin ese script el ejecutable no llega a disco y el paquete queda inoperable.
  esbuild: true       # binario nativo de esbuild (vía Vite/Vitest)
  sharp: true         # libvips precompilada (vía Next.js para next/image)
  unrs-resolver: true # resolver nativo de ESLint (vía eslint-config-next)

overrides:
  sharp: ">=0.35.0"
  postcss: ">=8.5.18"
  # Advisories altos detectados en la auditoría de dependencias de DT-017
  # (2026-08-09). Los tres son de dependencias de desarrollo y de build
  # (ESLint, coverage de Vitest, y postcss vía Next y Tailwind): ninguno tiene
  # ruta desde una petición HTTP en producción, pero el framework no admite
  # dejar altas abiertas.
  #
  # Los rangos llevan cota superior a propósito. El valor de un override es el
  # rango con el que se resuelve la dependencia, no un mínimo dentro de la
  # línea que ya estaba: sin cota, `nanoid` saltaría a 6.x —ESM puro, rompe
  # `postcss`, que pide ^3.3.11— y `js-yaml` a 5.x.
  "brace-expansion": ">=5.0.9 <6" # GHSA-rgw5-rvv9-x895
  "js-yaml@4": ">=4.3.1 <5" # GHSA-5p4m-2wfm-xmqj
  "nanoid@3": ">=3.3.17 <4" # GHSA-2v37-7h3g-55p8
  #
  # minimatch@3/@9 (arrastrados por eslint-plugin-import y por
  # @vitest/coverage-v8 vía glob) traían versiones de brace-expansion
  # demasiado antiguas para aceptar el override de arriba. Se suben a una mayor
  # moderna para que todo el árbol comparta la misma línea de brace-expansion,
  # que es la que recibe los parches.
  "minimatch@3": ">=10.0.0"
  "minimatch@9": ">=10.0.0"
